  function parseCSV(text) {
    const out = []; let row = [], cell = "", inQ = false;
    for (let i = 0; i < text.length; i++) {

      if (inQ) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else { inQ = false; } }

    if (window.google && google.script && google.script.run) {
      return new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getClubs());
    }
    if (CONFIG.apiUrl) {
      return fetch(CONFIG.apiUrl, { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error("API " + r.status);
        return r.json();
      }).then((j) => Array.isArray(j) ? j : j.rows);
    }
    if (CONFIG.csvUrl) {
      return fetch(CONFIG.csvUrl, { cache: "no-store" }).then((r) => r.text()).then(parseCSV);
    }
    return Promise.resolve(null);
  }

  function isPublic(r) { return String(r[COL.pub] || "").toUpperCase() !== "FALSE"; }

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return rows.filter((r) =>
      (!state.kind || r[COL.kind] === state.kind) &&
      (!state.sport || r[COL.sport] === state.sport) &&
      (!state.school || r[COL.school] === state.school || r[COL.school] === "全域") &&
      (!state.target || (r[COL.target] || "").includes(state.target)) &&
      (!q || [COL.name, COL.sport, COL.place, COL.desc, COL.school].some((k) => (r[k] || "").toLowerCase().includes(q)))
    );
  }

  function renderChips() {
    const base = rows.filter((r) => !state.kind || r[COL.kind] === state.kind);
    const counts = new Map();
    base.forEach((r) => { const s = r[COL.sport]; if (s) counts.set(s, (counts.get(s) || 0) + 1); });
    const sports = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
    if (state.sport && !counts.has(state.sport)) state.sport = "";
    $("sportChips").innerHTML =
      `<button type="button" data-sport="" aria-pressed="${state.sport === ""}">すべての種目</button>` +
      sports.map(([s, n]) => `<button type="button" data-sport="${esc(s)}" aria-pressed="${state.sport === s}">${esc(s)}<span class="n">${n}</span></button>`).join("");
  }

  function renderSchools() {
    const set = new Set(rows.map((r) => r[COL.school]).filter((s) => s && s !== "全域"));
    const sel = $("school");
    sel.innerHTML = `<option value="">すべての校区</option>` + [...set].sort((a, b) => a.localeCompare(b, "ja")).map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
    sel.value = state.school;
  }

  function card(r) {
    const isEvent = r[COL.kind] === "イベント";
    const url = (r[COL.url] || "").trim();
    const target = [r[COL.target], r[COL.grade]].filter(Boolean).join(" ／ ");
    return `
      <article class="card${isEvent ? " event" : ""}">
        <div class="card-head">
          <span class="tag${isEvent ? " kind-event" : ""}">${esc(isEvent ? "イベント" : r[COL.sport])}</span>
          ${isEvent && r[COL.sport] ? `<span class="tag">${esc(r[COL.sport])}</span>` : ""}
          ${r[COL.target] ? `<span class="tag target">${esc(r[COL.target])}</span>` : ""}
        </div>
        <h2>${esc(r[COL.name])}</h2>
        <dl class="facts">
          <div><dt>対象</dt><dd>${esc(target || "—")}</dd></div>
          <div><dt>費用</dt><dd class="fee">${esc(r[COL.fee] || "—")}</dd></div>
          <div><dt>${isEvent ? "日時" : "活動日"}</dt><dd>${esc(r[COL.days] || "—")}</dd></div>
          <div><dt>場所</dt><dd>${esc(r[COL.place] || "—")}</dd></div>
        </dl>
        <details>
          <summary><span class="open-label">くわしく見る</span><span class="close-label">閉じる</span></summary>
          <div class="detail-body">
            ${r[COL.desc] ? `<p>${esc(r[COL.desc])}</p>` : ""}
            <div class="meta">
              ${r[COL.school] ? `<span>校区：<b>${esc(r[COL.school])}</b></span>` : ""}
              ${r[COL.contact] ? `<span>連絡先：<b>${esc(r[COL.contact])}</b></span>` : ""}
            </div>
            ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">公式サイト・申込み ↗</a>` : ""}
          </div>
        </details>
      </article>`;
  }

  function render() {
    renderChips();
    const list = filtered();
    $("count").textContent = list.length;
    $("list").innerHTML = list.length
      ? list.map(card).join("")
      : `<div class="empty"><p>条件に合うクラブ・イベントが見つかりませんでした。</p><button type="button" id="resetEmpty">条件をクリアする</button></div>`;
    const b = $("resetEmpty"); if (b) b.addEventListener("click", resetAll);
  }

  function resetAll() {
    Object.assign(state, { kind: "", sport: "", school: "", target: "", q: "" });
    $("q").value = ""; $("searchBox").classList.remove("has-value");
    $("school").value = ""; $("target").value = "";
    $("kindSeg").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === "" ? "true" : "false"));
    render();
  }

  // ---- events ----
  $("q").addEventListener("input", (e) => {
    state.q = e.target.value; $("searchBox").classList.toggle("has-value", !!state.q); render();
  });
  $("clearQ").addEventListener("click", () => { $("q").value = ""; state.q = ""; $("searchBox").classList.remove("has-value"); render(); $("q").focus(); });
  $("kindSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.kind = b.dataset.kind;
    $("kindSeg").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    render();
  });
  $("sportChips").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.sport = b.dataset.sport; render();
  });
  $("school").addEventListener("change", (e) => { state.school = e.target.value; render(); });
  $("target").addEventListener("change", (e) => { state.target = e.target.value; render(); });
  $("resetAll").addEventListener("click", resetAll);

  // ---- boot ----
  loadData().then((data) => {
    if (data) {
      rows = data.filter(isPublic);
      $("updated").textContent = "この一覧はスプレッドシートから自動で読み込んでいます。";
    } else {
      rows = SAMPLE.filter(isPublic);
      const n = $("notice"); n.textContent = "サンプルデータを表示しています（団体名・費用・日程はすべて架空です）。"; n.classList.add("show");
    }
    renderSchools(); render();
  }).catch((err) => {
    $("list").innerHTML = `<div class="empty"><p>データを読み込めませんでした。</p><p style="font-size:12px">${esc(err && err.message || err)}</p></div>`;
    $("count").textContent = "0";
  });
</script>
</body>
</html>
